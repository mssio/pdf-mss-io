<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Document is served at `/` but must also work if paths change; keeps hashed asset URLs root-relative -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>PDF Toolbox</title>
    <script>
      (function () {
        try {
          var k = "pdf-mss-io-theme";
          var s = localStorage.getItem(k);
          var dark = s === "dark" || (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="./frontend.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
